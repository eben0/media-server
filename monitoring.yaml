x-shared: &shared
  extends:
    file: ./shared.yaml
    service: shared-syslog

services:
  grafana:
    <<: *shared
    image: grafana/grafana
    environment:
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: true
      GF_AUTH_ANONYMOUS_ENABLED: true
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      -  grafana-storage:/var/lib/grafana
    labels:
      - traefik.enable=true
      - traefik.http.services.grafana.loadbalancer.server.port=3000
      - traefik.http.routers.grafana.tls=true
      - traefik.http.routers.grafana.tls.certresolver=myresolver
      - traefik.http.routers.grafana.middlewares=auth@file

  prometheus:
    <<: *shared
    image: prom/prometheus
    command:
      - '--config.file=/etc/prometheus/config.yaml'
      - '--log.level=debug'
    volumes:
      - "./monitoring/prometheus.yaml:/etc/prometheus/config.yaml"
      - prom-storage:/prometheus
    depends_on:
      - cadvisor

  #loki:
  #  <<: *shared
  #  image: grafana/loki:2.8.0
  #  command: -config.file=/etc/loki/local-config.yaml
  #  ports:
  #    - 3100:3100
  #  volumes:
  #    - "./monitoring/loki.yaml:/etc/loki/config.yaml"
  #  restart: unless-stopped

  logstash:
    depends_on:
      - opensearch-node
    # image: docker.elastic.co/logstash/logstash-oss:8.14.3
    privileged: true
    user: root
    volumes:
      - logstash-storage:/var/lib/logstash
      - /var/log:/var/log
      - "./monitoring/logstash/logstash.yml:/etc/logstash/conf/logstash.yml"
      - "./monitoring/logstash/pipeline/:/usr/share/logstash/pipeline/"
    ports:
      - 12201:12201
      - 12201:12201/udp
    healthcheck:
      test: curl telnet://localhost:12201

    restart: unless-stopped
    environment:
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: $OPENSEARCH_INITIAL_ADMIN_PASSWORD
    build:
      dockerfile: monitoring/logstash/Dockerfile
    #command:  bash -c "bin/logstash-plugin install logstash-output-opensearch && /usr/local/bin/docker-entrypoint"

  opensearch-node:
    image: opensearchproject/opensearch:3
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    environment:
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: $OPENSEARCH_INITIAL_ADMIN_PASSWORD
      cluster.name: opensearch-cluster
      node.name: opensearch-node
      discovery.type: single-node
      discovery.seed_hosts: opensearch-node
      bootstrap.memory_lock: true
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -k -u admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD --silent --fail https://localhost:9200/_cluster/health || exit 1"]
    ports:
      - 9200:9200
      - 9600:9600
    volumes:
      - opensearch-storage:/usr/share/opensearch/data

  opensearch:
    depends_on:
      - opensearch-node
    image: opensearchproject/opensearch-dashboards:3
    expose:
      - '5601'
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch-node:9200"]'
      SERVER_BASEPATH: '/opensearch'
      SERVER_REWRITEBASEPATH: true
      HOME_DISABLEWELCOMESCREEN: true
      OPENSEARCHDASBOARDS_DEFAULTAPPID: 'discover'
    #volumes:
    #  -
    labels:
      - traefik.enable=true
      - traefik.http.routers.opensearch.tls=true
      - traefik.http.routers.opensearch.tls.certresolver=myresolver
      - traefik.http.routers.opensearch.middlewares=auth@file

  #promtail:
  #  <<: *shared
  #  image: grafana/promtail:2.8.0
  #  command: -config.file=/etc/promtail/config.yml
  #  volumes:
  #    - /var/log:/var/log
  #    - "./monitoring/promtail.yaml:/etc/promtail/config.yml"
  #  restart: unless-stopped

  cadvisor:
    <<: *shared
    image: gcr.io/cadvisor/cadvisor:latest
    privileged: true
    command:
      - '--housekeeping_interval=55s'
      - '--docker_only'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

volumes:
  grafana-storage:
  prom-storage:
  redis-storage:
  logstash-storage:
  opensearch-storage:
