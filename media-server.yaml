  #  image: postgres:15.4
  #  volumes:
  #    - db-storage:/var/lib/postgresql/data
  #  ports:
  #    - 5432:5432

  #pgadmin:
  #  <<: *shared
  #  image: dpage/pgadmin4
  #  volumes:
  #    - "${VOL_ROOT}/pgadmin:/var/lib/pgadmin:rw"
  #  ports:
  #    - 8888:80
  
  flaresolverr:
    <<: *shared
    image: ghcr.io/flaresolverr/flaresolverr:latest

  #ddclient:
  #  <<: *shared
  #  image: lscr.io/linuxserver/ddclient:latest
  #  volumes:
  #    - ./ddclient/ddclient.conf:/tmp/ddclient.conf
  #    - ./ddclient/env_config.sh:/custom-cont-init.d/env_config.sh:ro

volumes:
  db-storage:
  acme:
  winshare:
    driver_opts:
      type: cifs
      o: "username=${HOST_USER},password=${HOST_PASS},uid=${PUID},gid=${PGID},vers=3.0,rw"
      device: "${VOL_WINSHARE}"

configs:
  traefik_config:
    file: ./proxy/traefik.yml