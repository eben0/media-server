x-shared: &shared
  env_file:
    - vars.env
  restart: unless-stopped
  logging:
    driver: loki
    options:
      loki-url: "http://localhost:3100/loki/api/v1/push"
      mode: non-blocking
      max-buffer-size: 4m
      loki-retries: "3"

services:
  traefik:
    <<: *shared
    image: traefik:v2.11
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    configs:
      - source: traefik_config
        target: /etc/traefik/traefik.yml
    volumes:
      #- ./proxy/traefik.yml:/etc/traefik/traefik.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - acme:/etc/acme
  organizr:
    <<: *shared
    environment:
      - fpm=true
      - branch=v2-master # or v2-develop
    image: docker.io/organizr/organizr:latest
    volumes:
      - "${VOL_ROOT}/organizr:/config"
    ports:
      - 81:80
    labels:
      - traefik.enable=true
      - traefik.http.routers.organizr.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.organizr.tls=true
      - traefik.http.routers.organizr.tls.certresolver=myresolver
  plex:
    <<: *shared
    image: lscr.io/linuxserver/plex:latest
    environment:
      - VERSION=docker
      #- PLEX_CLAIM=xxx
    volumes:
      - "${VOL_ROOT}/plex:/config"
      - "${VOL_MEDIA}:/media"
      - "winshare:/winshare"
    ports:
      - 32400:32400
      - 1900:1900/udp
      - 3005:3005
      - 5353:5353/udp
      - 8324:8324
      - 32410:32410/udp
      - 32412:32412/udp
      - 32413:32413/udp
      - 32414:32414/udp
      - 32469:32469
    labels:
      - traefik.enable=true
      - traefik.http.routers.plex.tls=true
      - traefik.http.routers.plex.tls.certresolver=myresolver
      - traefik.http.services.plex.loadbalancer.server.port=32400

  jellyfin:
    <<: *shared
    image: linuxserver/jellyfin:latest
    volumes:
      - "${VOL_ROOT}/jellyfin:/config"
      - "${VOL_MEDIA}:/media"
      - "winshare:/winshare"
    ports:
      - 8096:8096
      - 8020:8020
      - 7359:7359/udp
      #- 1900:1900/udp
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"

  plexsync:
    <<: *shared
    image: eben0/plexsync:latest

  qb: # torrent client
    <<: *shared
    image: lscr.io/linuxserver/qbittorrent:latest
    environment:
      - WEBUI_PORT=8081
    volumes:
      - "${VOL_ROOT}/qbittorrent:/config"
      - "${VOL_MEDIA}:/media"
      - "winshare:/winshare"
    ports:
      - 8081:8081
      - 6881:6881
      - 6881:6881/udp
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.qb-redirect.redirectregex.regex=^(.*)/qb$$"
      - "traefik.http.middlewares.qb-redirect.redirectregex.replacement=$$1/qb/"
      - "traefik.http.middlewares.qb-strip.stripprefix.prefixes=/qb/"
      # appropropriate header changes
      - "traefik.http.middlewares.qb-headers.headers.customrequestheaders.X-Frame-Options=SAMEORIGIN"
      - "traefik.http.middlewares.qb-headers.headers.customrequestheaders.Referer="
      - "traefik.http.middlewares.qb-headers.headers.customrequestheaders.Origin="
      - "traefik.http.routers.qb.middlewares=qb-strip,qb-redirect,qb-headers"
      # loadbalancer to *not* pass the host header
      - "traefik.http.services.qb.loadbalancer.server.port=8081"
      - "traefik.http.services.qb.loadbalancer.passhostheader=false"
      - traefik.http.routers.qb.tls=true
      - traefik.http.routers.qb.tls.certresolver=myresolver

  nzbget: # usenet client
    <<: *shared
    image: linuxserver/nzbget:latest
    volumes:
      - "${VOL_ROOT}/nzbget:/config"
      - "${VOL_MEDIA}:/media"
      - "winshare:/winshare"
    ports:
      - 6789:6789
    labels:
      - traefik.enable=true
      - traefik.http.routers.nzbget.tls=true
      - traefik.http.routers.nzbget.tls.certresolver=myresolver
  # movie search
  radarr:
    <<: *shared
    image: linuxserver/radarr:latest
    volumes:
      - "${VOL_ROOT}/radarr:/config"
      - "${VOL_MEDIA}:/media"
      - "winshare:/winshare"
    ports:
      - 7878:7878
    labels:
      - traefik.enable=true
      - traefik.http.routers.radarr.tls=true
      - traefik.http.routers.radarr.tls.certresolver=myresolver

  sonarr:
    <<: *shared
    image: linuxserver/sonarr:latest
    volumes:
      - "${VOL_ROOT}/sonarr:/config"
      - "${VOL_MEDIA}:/media"
      - "winshare:/winshare"
    ports:
      - 8989:8989
    labels:
      - traefik.enable=true
      - traefik.http.routers.sonarr.tls=true
      - traefik.http.routers.sonarr.tls.certresolver=myresolver

  bazarr:
    <<: *shared
    image: linuxserver/bazarr:latest
    volumes:
      - "${VOL_ROOT}/bazarr:/config"
      - "${VOL_MEDIA}:/media"
      - "winshare:/winshare"
    ports:
      - 6767:6767
    labels:
      - traefik.enable=true
      - traefik.http.routers.bazarr.tls=true
      - traefik.http.routers.bazarr.tls.certresolver=myresolver

  prowlarr:
    <<: *shared
    image: linuxserver/prowlarr:latest
    volumes:
      - "${VOL_ROOT}/prowlarr:/config"
    ports:
      - 9696:9696
    labels:
      - traefik.enable=true
      - traefik.http.routers.prowlarr.tls=true
      - traefik.http.routers.prowlarr.tls.certresolver=myresolver

  ombi:
    <<: *shared
    image: linuxserver/ombi:latest
    volumes:
      - "${VOL_ROOT}/ombi:/config"
    ports:
      - 5000:3579
    environment:
      BASE_URL: /ombi
    labels:
      - traefik.enable=true
      - traefik.http.routers.ombi.tls=true
      - traefik.http.routers.ombi.tls.certresolver=myresolver

  tautulli:
    <<: *shared
    image: ghcr.io/tautulli/tautulli:latest
    volumes:
      - "${VOL_ROOT}/tautulli:/config"
    ports:
      - 8181:8181
    labels:
      - traefik.enable=true
      - traefik.http.routers.tautulli.tls=true
      - traefik.http.routers.tautulli.tls.certresolver=myresolver

  #db:
