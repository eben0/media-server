services:
  shared:
      env_file:
        - vars.env
      restart: unless-stopped
      logging:
        driver: loki
        options:
          loki-url: "http://localhost:3100/loki/api/v1/push"
          mode: non-blocking
          max-buffer-size: 4m
          loki-retries: "3"
      pull_policy: always
  shared-syslog:
      env_file:
        - vars.env
      restart: unless-stopped
      logging:
        driver: gelf
        options:
          gelf-address: "udp://localhost:12201"
          gelf-compression-type: none