input {
  file {
    path => "/var/log/*.log"
  }
}

output {
  opensearch {
     hosts => ["https://opensearch-node:9200"]
     index => "logstash-varlog-%{+YYYY.MM.dd}"
     user => "admin"
     password => "${OPENSEARCH_INITIAL_ADMIN_PASSWORD}"
     ssl => true
     ssl_certificate_verification => false
   }
}